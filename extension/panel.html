<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preguntazo · Panel del presentador</title>
  <link rel="icon" href="icons/icon-32.png">
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="panel.css">
  <script src="lib/stage.js"></script>
  <script src="panel.js" type="module"></script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="icons/icon-48.png" width="30" height="30" alt="">
      <div class="brand-text">
        <span class="brand-name">Preguntazo</span>
        <input class="title-input" id="title" maxlength="80" spellcheck="false" data-i18n-aria="talkTitle">
      </div>
    </div>
    <div class="top-right">
      <span class="pill" id="status" data-tone="muted"><i></i><span id="status-text" data-i18n="statusStarting"></span></span>
      <span class="code-chip" id="code-chip" data-i18n-title="codeTitle"></span>
      <button class="btn icon" id="options" data-i18n-title="settings" data-i18n-aria="settings">
        <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <main class="main">
      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="preguntas" aria-selected="true"><span data-i18n="tabQuestions"></span><b class="count" id="c-questions"></b></button>
        <button role="tab" data-tab="encuestas" aria-selected="false"><span data-i18n="tabPolls"></span><b class="count live-dot" id="c-polls"></b></button>
        <button role="tab" data-tab="reacciones" aria-selected="false"><span data-i18n="tabReactions"></span><b class="count" id="c-reactions"></b></button>
        <button role="tab" data-tab="publico" aria-selected="false"><span data-i18n="tabAudience"></span><b class="count" id="c-people"></b></button>
      </nav>

      <!-- Preguntas -->
      <section class="tab" id="tab-preguntas">
        <div class="toolbar">
          <div class="seg filter" id="q-filter" role="radiogroup">
            <button type="button" role="radio" data-v="all" aria-checked="true"><span data-i18n="filterAll"></span> <span class="n" id="f-all"></span></button>
            <button type="button" role="radio" data-v="pending"><span data-i18n="filterPending"></span> <span class="n" id="f-pending"></span></button>
            <button type="button" role="radio" data-v="open"><span data-i18n="filterOpen"></span> <span class="n" id="f-open"></span></button>
            <button type="button" role="radio" data-v="answered"><span data-i18n="filterAnswered"></span> <span class="n" id="f-answered"></span></button>
            <button type="button" role="radio" data-v="hidden"><span data-i18n="filterHidden"></span> <span class="n" id="f-hidden"></span></button>
          </div>
          <div class="seg sort" id="q-sort" role="radiogroup">
            <button type="button" role="radio" data-v="top" aria-checked="true" data-i18n="sortTop"></button>
            <button type="button" role="radio" data-v="new" data-i18n="sortNew"></button>
          </div>
          <input class="input search" id="q-search" type="search" data-i18n-aria="search">
        </div>

        <div class="switches">
          <label class="sw"><input type="checkbox" class="switch" data-setting="questionsOpen"><span data-i18n="swQuestionsOpen"></span></label>
          <label class="sw"><input type="checkbox" class="switch" data-setting="moderation"><span data-i18n="swModeration"></span></label>
          <label class="sw"><input type="checkbox" class="switch" data-setting="anonymous"><span data-i18n="swAnonymous"></span></label>
          <label class="sw"><input type="checkbox" class="switch" data-setting="publicQuestions"><span data-i18n="swPublic"></span></label>
          <span class="spacer"></span>
          <button class="btn small ghost" id="export-q" type="button">
            <svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
            <span data-i18n="exportCsv"></span>
          </button>
        </div>

        <ul class="qlist" id="qlist"></ul>
        <div class="empty" id="q-empty">
          <div class="empty-icon"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M9.5 8.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.2M12 15.2v.1"/></svg></div>
          <b id="q-empty-title"></b>
          <span class="muted" id="q-empty-body"></span>
        </div>
      </section>

      <!-- Encuestas -->
      <section class="tab" id="tab-encuestas" hidden>
        <div class="poll-layout">
          <form class="card editor" id="editor" autocomplete="off">
            <div class="editor-head">
              <h2 id="editor-title" data-i18n="newPoll"></h2>
              <button class="btn small ghost" id="editor-cancel" type="button" data-i18n="cancel" hidden></button>
            </div>
            <input class="input" id="poll-q" maxlength="160" data-i18n-aria="pollQuestion" required>
            <div class="seg kinds" id="poll-kind" role="radiogroup">
              <button type="button" role="radio" data-v="single" aria-checked="true" data-i18n="kindSingle"></button>
              <button type="button" role="radio" data-v="multi" data-i18n="kindMulti"></button>
              <button type="button" role="radio" data-v="rating" data-i18n="kindRating"></button>
              <button type="button" role="radio" data-v="words" data-i18n="kindWords"></button>
            </div>
            <p class="muted small kind-hint" id="kind-hint"></p>
            <ol class="options" id="poll-options"></ol>
            <button class="btn small ghost add-option" id="add-option" type="button">
              <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="addOption"></span>
            </button>
            <div class="templates">
              <span class="label" data-i18n="templates"></span>
              <div class="chips" id="templates"></div>
            </div>
            <p class="form-error" id="editor-error" hidden></p>
            <div class="editor-actions">
              <button class="btn" type="submit" id="save-poll" data-i18n="savePoll"></button>
              <button class="btn accent" type="button" id="save-open" data-i18n="saveAndOpen"></button>
            </div>
          </form>

          <div class="polls-col">
            <div class="switches">
              <label class="sw"><input type="checkbox" class="switch" data-setting="resultsLive"><span data-i18n="swResults"></span></label>
              <span class="spacer"></span>
              <button class="btn small ghost" id="export-p" type="button">
                <svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
                <span data-i18n="exportCsv"></span>
              </button>
            </div>
            <ul class="plist" id="plist"></ul>
            <div class="empty" id="p-empty">
              <div class="empty-icon"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></div>
              <b data-i18n="pollsEmptyTitle"></b>
              <span class="muted" data-i18n="pollsEmptyBody"></span>
            </div>
          </div>
        </div>
      </section>

      <!-- Reacciones -->
      <section class="tab" id="tab-reacciones" hidden>
        <div class="card">
          <label class="row">
            <span>
              <span class="row-title" data-i18n="swReactions"></span>
              <span class="row-sub muted" data-i18n="swReactionsSub"></span>
            </span>
            <input type="checkbox" class="switch" data-setting="reactionsOn">
          </label>
        </div>
        <div class="card">
          <h2 data-i18n="emojiTitle"></h2>
          <p class="muted small" data-i18n="emojiBody"></p>
          <div class="emoji-grid" id="emoji-grid"></div>
        </div>
        <div class="card">
          <div class="row-head">
            <h2 data-i18n="totalsTitle"></h2>
            <button class="btn small" id="test-react" type="button" data-i18n="testReactions"></button>
          </div>
          <div class="totals" id="totals"></div>
        </div>
      </section>

      <!-- Público -->
      <section class="tab" id="tab-publico" hidden>
        <div class="card">
          <div class="row-head">
            <h2 id="people-title"></h2>
          </div>
          <ul class="people" id="people"></ul>
          <p class="muted small" id="people-empty" data-i18n="peopleEmpty"></p>
        </div>
        <div class="card danger-zone">
          <h2 data-i18n="roomTitle"></h2>
          <div class="row">
            <span>
              <span class="row-title" data-i18n="newCode"></span>
              <span class="row-sub muted" data-i18n="newCodeSub"></span>
            </span>
            <button class="btn small" id="new-code" type="button" data-i18n="newCodeBtn"></button>
          </div>
          <div class="row">
            <span>
              <span class="row-title" data-i18n="clearRoom"></span>
              <span class="row-sub muted" data-i18n="clearRoomSub"></span>
            </span>
            <button class="btn small danger" id="clear-room" type="button" data-i18n="clearRoomBtn"></button>
          </div>
        </div>
      </section>
    </main>

    <aside class="aside">
      <div class="label" data-i18n="onScreen"></div>
      <div class="preview" id="preview">
        <div class="preview-slide"><span data-i18n="yourSlide"></span></div>
        <div class="preview-stage" id="preview-stage"></div>
      </div>
      <p class="muted small where" id="where"></p>

      <div class="controls">
        <button class="tool" id="big-qr" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v1M14 20h1M17 20h4v-3"/></svg>
          <span data-i18n="bigQr"></span><kbd>Alt⇧Q</kbd>
        </button>
        <button class="tool" id="next-q" type="button">
          <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="m10 8 3 2-3 2"/></svg>
          <span data-i18n="nextQuestion"></span><kbd>Alt⇧N</kbd>
        </button>
        <button class="tool" id="clear" type="button">
          <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="m9 8 6 6M15 8l-6 6"/></svg>
          <span data-i18n="clearScreen"></span><kbd>Alt⇧X</kbd>
        </button>
      </div>

      <div class="card badge-card">
        <label class="row">
          <span class="row-title" data-i18n="swBadge"></span>
          <input type="checkbox" class="switch" data-setting="qrBadge">
        </label>
        <div class="row">
          <span class="row-sub muted" data-i18n="corner"></span>
          <div class="seg corner" id="qr-corner" role="radiogroup">
            <button type="button" role="radio" data-v="tl" data-i18n-aria="cornerTl">↖</button>
            <button type="button" role="radio" data-v="tr" data-i18n-aria="cornerTr">↗</button>
            <button type="button" role="radio" data-v="bl" data-i18n-aria="cornerBl">↙</button>
            <button type="button" role="radio" data-v="br" data-i18n-aria="cornerBr">↘</button>
          </div>
        </div>
        <div class="row">
          <span class="row-sub muted" data-i18n="size"></span>
          <div class="seg" id="qr-size" role="radiogroup">
            <button type="button" role="radio" data-v="s">S</button>
            <button type="button" role="radio" data-v="m">M</button>
            <button type="button" role="radio" data-v="l">L</button>
          </div>
        </div>
      </div>

      <div class="card share">
        <div class="share-qr" id="share-qr"></div>
        <div class="share-text">
          <span class="share-code" id="share-code"></span>
          <span class="muted small" id="share-short"></span>
          <div class="share-actions">
            <button class="btn small" id="copy" type="button" data-i18n="copyLink"></button>
            <button class="btn small" id="download-qr" type="button" data-i18n="downloadQr"></button>
          </div>
        </div>
      </div>
      <button class="btn wide" id="open-screen" type="button">
        <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 21h8M12 18v3"/></svg>
        <span data-i18n="openScreen"></span>
      </button>
    </aside>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
